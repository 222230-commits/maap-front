@if (!authService.isLoggedIn() || authService.role() === 'buyer') {

  <footer class="footer">
    <div class="footer-container">

      <!-- يمين: Logo + وصف -->
      <div class="footer-brand">
        <a routerLink="/" class="footer-logo-link">
          <img src="assets/logo.png"
               alt="مأب"
               class="logo-footer" />
        </a>
        <p>مساحة تجمع المشاريع الصغيرة والصُنّاع المحليين في ليبيا.</p>
        <p class="footer-made">
          صُنع بـ <i class="fas fa-heart"></i> في ليبيا
        </p>
      </div>

      <!-- وسط: روابط -->
      <div class="footer-links">
        <a routerLink="/">الرئيسية</a>
        <a routerLink="/products">المنتجات</a>
        <a routerLink="/stores">المتاجر</a>
        <a routerLink="/terms">الشروط والأحكام</a>
        <a routerLink="/support">الدعم الفني</a>
        <a routerLink="/support">FAQ</a>
      </div>

      <!-- يسار: سوشيال -->
      <div class="footer-social">
        <a href="#" aria-label="واتساب"><i class="fab fa-whatsapp"></i></a>
        <a href="#" aria-label="تيك توك"><i class="fab fa-tiktok"></i></a>
        <a href="#" aria-label="فيسبوك"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="انستغرام"><i class="fab fa-instagram"></i></a>
      </div>

    </div>

    <div class="footer-bottom">
      <span>© 2026 مأب — جميع الحقوق محفوظة</span>
    </div>
  </footer>

}
