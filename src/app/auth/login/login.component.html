<div class="auth-page">

  <!-- يمين: Hero -->
  <div class="auth-hero">
    <div class="auth-hero-content">
      <div class="auth-logo">
        <img src="assets/logo.png" alt="مأب"
             onerror="this.style.display='none';
             this.nextElementSibling.style.display='block'" />
        <span style="display:none">مأب</span>
      </div>
      <h2>مرحباً بعودتك</h2>
      <p>سجّل دخولك واستمر في التسوق من أفضل المتاجر الليبية</p>
      <div class="auth-hero-features">
        <div class="hero-feature">
          <i class="fas fa-shield-alt"></i>
          <span>تسوق آمن ومضمون</span>
        </div>
        <div class="hero-feature">
          <i class="fas fa-store"></i>
          <span>+{{ heroStats.shops }} متجر نشط</span>
        </div>
        <div class="hero-feature">
          <i class="fas fa-box"></i>
          <span>+{{ heroStats.products }} منتج متاح</span>
        </div>
      </div>
    </div>
  </div>

  <!-- يسار: Form -->
  <div class="auth-form-side">
    <div class="auth-form-container">

      <div class="form-header">
        <h1>تسجيل الدخول</h1>
        <p>أدخل بياناتك للوصول لحسابك</p>
      </div>

      @if (errorMessage()) {
        <div class="form-alert error">
          <i class="fas fa-exclamation-circle"></i>
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="form-field">
          <label for="login-email">البريد الإلكتروني</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email"
                   id="login-email"
                   formControlName="email"
                   placeholder="example@gmail.com"
                   dir="ltr" />
          </div>
        </div>

        <div class="form-field">
          <div class="field-label-row">
            <label for="login-password">كلمة المرور</label>
            <a routerLink="/auth/forgot-password"
               class="forgot-link">
              نسيت كلمة المرور؟
            </a>
          </div>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input [type]="showPassword() ? 'text' : 'password'"
                   id="login-password"
                   formControlName="password"
                   placeholder="••••••••"
                   dir="ltr" />
            <button type="button"
                    class="toggle-pw"
                    (click)="showPassword.update(v => !v)">
              <i [class]="showPassword()
                ? 'fas fa-eye-slash'
                : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit"
                class="btn-submit"
                [disabled]="isLoading() || loginForm.invalid">
          @if (isLoading()) {
            <i class="fas fa-spinner fa-spin"></i>
            جاري الدخول...
          } @else {
            <i class="fas fa-arrow-left"></i>
            تسجيل الدخول
          }
        </button>

      </form>

      <div class="form-footer">
        <span>ليس لديك حساب؟</span>
        <a routerLink="/auth/register">أنشئ حساباً الآن</a>
      </div>

    </div>
  </div>

</div>
